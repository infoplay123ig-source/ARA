<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gay Bird</title>
  <style>
    body {
      margin: 0;
      background: #70c5ce;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial;
    }
    canvas {
      border: 4px solid #333;
      background: #70c5ce;
    }
  </style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let bird = { x: 80, y: 300, vy: 0, radius: 18 };
let gravity = 0.45;
let jump = -8.5;
let pipes = [];
let frame = 0;
let score = 0;
let gameOver = false;

function createPipe() {
  const gap = 150;
  const top = Math.random() * 250 + 50;
  pipes.push({
    x: canvas.width,
    top: top,
    bottom: top + gap,
    width: 60,
    passed: false,
    isFemale: Math.random() > 0.5 // نصف لوله‌ها "ماده" هستن
  });
}

function drawBird() {
  ctx.fillStyle = "#ffcc00";
  ctx.beginPath();
  ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
  ctx.fill();
  
  // چشم
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(bird.x + 7, bird.y - 5, 3, 0, Math.PI * 2);
  ctx.fill();
}

function drawPipes() {
  pipes.forEach(pipe => {
    // لوله بالا
    ctx.fillStyle = pipe.isFemale ? "#ff69b4" : "#2ecc71"; // ماده = صورتی
    ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);
    
    // لوله پایین
    ctx.fillRect(pipe.x, pipe.bottom, pipe.width, canvas.height - pipe.bottom);
    
    // علامت ماده
    if (pipe.isFemale) {
      ctx.fillStyle = "#fff";
      ctx.font = "20px Arial";
      ctx.fillText("♀", pipe.x + 18, pipe.top - 10);
    }
  });
}

function update() {
  if (gameOver) return;

  bird.vy += gravity;
  bird.y += bird.vy;

  // تولید لوله
  if (frame % 100 === 0) createPipe();

  pipes.forEach(pipe => {
    pipe.x -= 2.5;

    // برخورد
    if (
      bird.x + bird.radius > pipe.x &&
      bird.x - bird.radius < pipe.x + pipe.width &&
      (bird.y - bird.radius < pipe.top || bird.y + bird.radius > pipe.bottom)
    ) {
      if (pipe.isFemale) {
        gameOver = true; // اگه به ماده بخوره می‌بازه
      } else {
        // به لوله معمولی هم بخوره می‌بازه
        gameOver = true;
      }
    }

    // امتیاز
    if (!pipe.passed && pipe.x + pipe.width < bird.x) {
      score++;
      pipe.passed = true;
    }
  });

  // حذف لوله‌های خارج شده
  pipes = pipes.filter(p => p.x + p.width > 0);

  // برخورد با زمین و سقف
  if (bird.y + bird.radius > canvas.height || bird.y - bird.radius < 0) {
    gameOver = true;
  }

  frame++;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawPipes();
  drawBird();

  ctx.fillStyle = "#000";
  ctx.font = "24px Arial";
  ctx.fillText("Score: " + score, 20, 40);

  if (gameOver) {
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#fff";
    ctx.font = "32px Arial";
    ctx.fillText("باختی!", 150, 280);
    ctx.font = "18px Arial";
    ctx.fillText("به جنس ماده خوردی 😂", 110, 320);
    ctx.fillText("کلیک یا اسپیس برای شروع دوباره", 70, 360);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function jumpBird() {
  if (gameOver) {
    // ریست
    bird.y = 300;
    bird.vy = 0;
    pipes = [];
    score = 0;
    frame = 0;
    gameOver = false;
  } else {
    bird.vy = jump;
  }
}

document.addEventListener("keydown", e => {
  if (e.code === "Space") jumpBird();
});
canvas.addEventListener("click", jumpBird);

loop();
</script>
</body>
</html>
